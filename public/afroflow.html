<title>AfroFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --surface-2:#ECEFE9; --surface-3:#E4E7DF;
  --border:#DFE3D9; --border-strong:#CBD1C4;
  --text:#131F1B; --text-2:#4E5C55; --text-muted:#87938B;
  --accent:#0E6E86; --accent-strong:#0A5266; --accent-soft:#E1F0F3; --accent-text:#FFFFFF;
  --good:#0ca30c; --good-soft:#E4F6E1; --good-text:#0A6E0A;
  --warn:#B9790E; --warn-soft:#FCEFD9; --warn-text:#8A5A05;
  --crit:#d03b3b; --crit-soft:#FBE6E4; --crit-text:#A82F2F;
  --shadow: 0 1px 2px rgba(19,31,27,0.06), 0 8px 24px -12px rgba(19,31,27,0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1210; --surface:#121B18; --surface-2:#17211D; --surface-3:#1D2822;
    --border:#233530; --border-strong:#2E443C;
    --text:#EAF1EE; --text-2:#B3C2BB; --text-muted:#728179;
    --accent:#49AFC7; --accent-strong:#6FC4D9; --accent-soft:#12333A; --accent-text:#06171A;
    --good:#33C24B; --good-soft:#123B1B; --good-text:#5FE07A;
    --warn:#F0AC3A; --warn-soft:#3A2C0F; --warn-text:#F5C56D;
    --crit:#F2685F; --crit-soft:#3A1614; --crit-text:#FF9089;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -14px rgba(0,0,0,0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1210; --surface:#121B18; --surface-2:#17211D; --surface-3:#1D2822;
  --border:#233530; --border-strong:#2E443C;
  --text:#EAF1EE; --text-2:#B3C2BB; --text-muted:#728179;
  --accent:#49AFC7; --accent-strong:#6FC4D9; --accent-soft:#12333A; --accent-text:#06171A;
  --good:#33C24B; --good-soft:#123B1B; --good-text:#5FE07A;
  --warn:#F0AC3A; --warn-soft:#3A2C0F; --warn-text:#F5C56D;
  --crit:#F2685F; --crit-soft:#3A1614; --crit-text:#FF9089;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -14px rgba(0,0,0,0.6);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Sora", "IBM Plex Sans", sans-serif; font-weight:700; margin:0; text-wrap:balance; letter-spacing:-0.01em;}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

.shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex:none; background:var(--surface-2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:20px 20px 16px;}
.brand-mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(155deg, var(--accent), var(--accent-strong)); flex:none; position:relative;}
.brand-mark::after{content:""; position:absolute; inset:8px 6px; border:2px solid rgba(255,255,255,0.85); border-right-color:transparent; border-bottom-color:transparent; border-radius:3px; transform:rotate(45deg);}
.brand-name{font-family:"Sora",sans-serif; font-weight:800; font-size:16.5px; letter-spacing:-0.01em;}
.brand-sub{font-size:10.5px; color:var(--text-muted); letter-spacing:.04em; text-transform:uppercase; margin-top:1px;}
.nav{padding:8px 12px; display:flex; flex-direction:column; gap:1px; overflow-y:auto; flex:1;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); padding:14px 10px 6px;}
.nav-link{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px;
  color:var(--text-2); text-decoration:none; font-size:13.3px; font-weight:500; cursor:pointer;
  border:1px solid transparent;
}
.nav-link:hover{background:var(--surface-3); color:var(--text);}
.nav-link.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
.nav-link svg{width:16px; height:16px; flex:none;}
.nav-badge{margin-left:auto; font-size:10.5px; font-weight:700; background:var(--crit-soft); color:var(--crit-text); padding:1px 6px; border-radius:99px;}
.sidebar-foot{padding:14px 18px; border-top:1px solid var(--border); display:flex; align-items:center; gap:9px;}
.avatar{width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex:none;}
.foot-name{font-size:12.5px; font-weight:600;}
.foot-role{font-size:10.8px; color:var(--text-muted);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:14px 28px;
}
.page-title{font-size:16.5px;}
.search{
  flex:1; max-width:360px; display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:8px; padding:7px 11px; color:var(--text-muted); font-size:13px;
}
.search input{border:none; outline:none; background:none; color:var(--text); font-size:13px; width:100%; font-family:inherit;}
.search svg{width:15px; height:15px; flex:none;}
.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:7px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--text); font-size:13px; font-weight:600; padding:8px 13px; cursor:pointer;
}
.btn:hover{background:var(--surface-3);}
.btn:focus-visible, .nav-link:focus-visible, input:focus-visible, select:focus-visible, .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn svg{width:14px; height:14px;}
.content{padding:26px 28px 60px; flex:1;}

.grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 17px; box-shadow:var(--shadow);}
.stat-label{font-size:12px; color:var(--text-muted); font-weight:500; display:flex; align-items:center; justify-content:space-between;}
.stat-value{font-family:"Sora",sans-serif; font-size:26px; font-weight:700; margin-top:7px; letter-spacing:-0.02em;}
.stat-sub{font-size:11.5px; color:var(--text-muted); margin-top:3px;}
.stat-dot{width:7px; height:7px; border-radius:50%;}

.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-head h2{font-size:14.5px;}
.section-head .link{font-size:12.3px; color:var(--accent); cursor:pointer; font-weight:600;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;}
@media (max-width:980px){.two-col{grid-template-columns:1fr;}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow);}
.stack{display:flex; flex-direction:column;}
.divide > * + *{border-top:1px solid var(--border);}

.priority-row{display:flex; gap:12px; padding:13px 15px; align-items:flex-start; cursor:pointer;}
.priority-row:hover{background:var(--surface-2);}
.priority-stripe{width:3px; align-self:stretch; border-radius:3px; flex:none;}
.priority-body{flex:1; min-width:0;}
.priority-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.order-id{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--text-muted); font-weight:500;}
.priority-title{font-size:13.3px; font-weight:600; margin-top:2px;}
.priority-desc{font-size:12.5px; color:var(--text-2); margin-top:2px;}
.priority-meta{font-size:11.3px; color:var(--text-muted); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap;}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap;}
.pill-dot{width:6px; height:6px; border-radius:50%;}
.pill-good{background:var(--good-soft); color:var(--good-text);}
.pill-warn{background:var(--warn-soft); color:var(--warn-text);}
.pill-crit{background:var(--crit-soft); color:var(--crit-text);}
.pill-neutral{background:var(--surface-3); color:var(--text-2);}

.task-row{display:flex; align-items:center; gap:11px; padding:11px 15px;}
.task-check{width:17px; height:17px; border-radius:5px; border:1.5px solid var(--border-strong); flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface);}
.task-check.done{background:var(--good); border-color:var(--good);}
.task-check.disabled{cursor:default; opacity:.45;}
.task-check.done svg{width:11px; height:11px; stroke:white;}
.task-name{font-size:13px; font-weight:500;}
.task-name.done{text-decoration:line-through; color:var(--text-muted);}
.task-name.future{color:var(--text-muted);}
.task-order{font-size:11.3px; color:var(--text-muted); margin-top:1px;}
.task-meta{margin-left:auto; display:flex; align-items:center; gap:10px; flex:none;}
.owner-chip{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-2);}
.owner-dot{width:19px; height:19px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:var(--text-2);}

.progress-track{height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden;}
.progress-fill{height:100%; border-radius:99px; background:var(--accent); transition:width .35s ease;}

.pipeline-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
.pipeline-stage{flex:none; min-width:118px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 13px;}
.pipeline-count{font-family:"Sora",sans-serif; font-size:22px; font-weight:700;}
.pipeline-label{font-size:11.2px; color:var(--text-muted); margin-top:2px;}

.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.select{border:1px solid var(--border-strong); background:var(--surface); border-radius:7px; padding:7px 10px; font-size:12.6px; color:var(--text); font-family:inherit;}
.viewtoggle{display:flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden;}
.viewtoggle button{border:none; background:var(--surface); padding:7px 12px; font-size:12.6px; font-weight:600; color:var(--text-2); cursor:pointer;}
.viewtoggle button.active{background:var(--accent); color:var(--accent-text);}

table{width:100%; border-collapse:collapse; font-size:12.8px;}
thead th{text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; padding:9px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--surface-2);}
.table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow);}
.cell-strong{font-weight:600;}
.health-bar{width:52px; height:5px; border-radius:99px; background:var(--surface-3); overflow:hidden; display:inline-block; vertical-align:middle; margin-right:7px;}
.health-fill{height:100%;}

.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:12px;}
.kcol{flex:none; width:250px; display:flex; flex-direction:column;}
.kcol-head{display:flex; align-items:center; justify-content:space-between; padding:0 4px 9px;}
.kcol-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2);}
.kcol-count{font-size:11px; color:var(--text-muted); background:var(--surface-3); padding:1px 7px; border-radius:99px;}
.kcol-body{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:8px; min-height:60px; flex:1;}
.kcard{background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:11px 12px; cursor:pointer; box-shadow:var(--shadow);}
.kcard:hover{border-color:var(--border-strong);}
.kcard-top{display:flex; justify-content:space-between; align-items:center;}
.kcard-cust{font-size:12.8px; font-weight:600; margin-top:6px;}
.kcard-country{font-size:11.3px; color:var(--text-muted);}
.kcard-step{font-size:11.5px; color:var(--text-2); margin-top:7px; padding-top:7px; border-top:1px solid var(--border);}
.kcard-ship{font-size:10.8px; color:var(--text-muted); margin-top:5px;}

.detail-head{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px;}
.detail-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
.detail-idrow{display:flex; align-items:center; gap:10px;}
.detail-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:16px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border);}
.dg-label{font-size:10.8px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:4px;}
.dg-value{font-size:13.5px; font-weight:600;}
.ring{width:56px; height:56px; flex:none;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto;}
.tab{border:none; background:none; padding:10px 14px; font-size:12.8px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}

.stepper{display:flex; flex-direction:column;}
.step{display:flex; gap:13px;}
.step-rail{display:flex; flex-direction:column; align-items:center; flex:none;}
.step-dot{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; border:2px solid var(--border-strong); background:var(--surface); font-size:10px;}
.step-dot.done{background:var(--good); border-color:var(--good); color:#fff;}
.step-dot.current{border-color:var(--accent); background:var(--accent-soft);}
.step-dot.blocked{border-color:var(--crit); background:var(--crit-soft);}
.step-line{width:2px; flex:1; background:var(--border); min-height:22px;}
.step-line.done{background:var(--good);}
.step-body{padding-bottom:26px; flex:1; padding-top:1px;}
.step-title{font-size:13.3px; font-weight:600;}
.step-status{font-size:11.8px; margin-top:2px;}

.blocker-box{border:1px solid color-mix(in srgb, var(--crit) 35%, var(--border)); background:var(--crit-soft); border-radius:10px; padding:14px 16px; margin-bottom:18px;}
.blocker-box h4{font-size:12.8px; color:var(--crit-text);}
.blocker-box p{font-size:12.8px; margin:5px 0 0; color:var(--text);}

.doclist{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;}
.doc-item{border:1px solid var(--border); border-radius:9px; padding:12px 13px; background:var(--surface); display:flex; flex-direction:column; gap:6px;}
.doc-name{font-size:12.8px; font-weight:600;}

.timeline{position:relative; padding-left:22px;}
.timeline::before{content:""; position:absolute; left:5px; top:5px; bottom:5px; width:2px; background:var(--border);}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item::before{content:""; position:absolute; left:-22px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); box-shadow:0 0 0 2px var(--accent);}
.tl-date{font-size:10.8px; color:var(--text-muted); font-family:"IBM Plex Mono",monospace;}
.tl-text{font-size:13px; margin-top:2px; font-weight:500;}

.modal-back{position:fixed; inset:0; background:rgba(10,15,13,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--surface); border-radius:12px; border:1px solid var(--border); width:min(560px,100%); max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px -20px rgba(0,0,0,0.4);}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--border);}
.modal-body{padding:20px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
.field label{font-size:11.8px; font-weight:600; color:var(--text-2);}
.field input, .field select{border:1px solid var(--border-strong); border-radius:7px; padding:8px 10px; font-size:13px; background:var(--surface); color:var(--text); font-family:inherit;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field-hint{font-size:11.3px; color:var(--text-muted); margin-top:10px; line-height:1.5;}
.modal-foot{display:flex; justify-content:flex-end; gap:9px; padding:16px 20px; border-top:1px solid var(--border);}
.icon-btn{border:none; background:none; cursor:pointer; color:var(--text-muted); padding:4px; display:flex;}
.icon-btn:hover{color:var(--text);}

.bar-chart{display:flex; flex-direction:column; gap:11px;}
.bar-row{display:grid; grid-template-columns:118px 1fr 40px; align-items:center; gap:10px; font-size:12.3px;}
.bar-track{height:10px; background:var(--surface-3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; border-radius:4px;}

.empty{padding:40px 20px; text-align:center; color:var(--text-muted); font-size:13px;}
.chip-list{display:flex; gap:7px; flex-wrap:wrap;}
.subtle-card{background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:12px 13px;}

.ai-shell{display:grid; grid-template-columns:280px 1fr; gap:18px; align-items:start;}
@media (max-width:900px){.ai-shell{grid-template-columns:1fr;}}
.ai-q{width:100%; text-align:left; border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:11px 12px; font-size:12.6px; cursor:pointer; margin-bottom:8px; color:var(--text-2); font-family:inherit;}
.ai-q:hover{border-color:var(--accent); color:var(--text);}
.ai-answer{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px 24px; box-shadow:var(--shadow); min-height:320px;}
.ai-input-row{display:flex; gap:8px; margin-top:16px;}
.ai-input-row input{flex:1; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; font-size:13px; background:var(--surface); color:var(--text); font-family:inherit;}
.reason-item{display:flex; gap:9px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.8px;}
.reason-item:last-child{border-bottom:none;}
.reason-num{font-family:"IBM Plex Mono",monospace; color:var(--accent); font-weight:700; flex:none;}

.calrow{display:flex; align-items:center; gap:13px; padding:11px 15px;}
.caldate{width:52px; flex:none; text-align:center; border-right:1px solid var(--border); padding-right:12px;}
.caldate .d{font-family:"Sora",sans-serif; font-size:17px; font-weight:700;}
.caldate .m{font-size:10px; color:var(--text-muted); text-transform:uppercase;}

@media (max-width:760px){
  .sidebar{position:fixed; left:-236px; z-index:50; transition:left .2s;}
  .sidebar.open{left:0;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:12px 14px;}
  .search{display:none;}
  .detail-grid{grid-template-columns:repeat(2,1fr);}
}
[hidden]{display:none !important;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--text); color:var(--bg); font-size:12.8px; font-weight:600;
  padding:10px 18px; border-radius:8px; box-shadow:var(--shadow);
  opacity:0; transition:opacity .2s ease, transform .2s ease; z-index:200; pointer-events:none;
  max-width:min(420px, calc(100vw - 40px));
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.locked-hint{font-size:11px; color:var(--text-muted);}
</style>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">AfroFlow</div>
        <div class="brand-sub">Afro Asiatic Exporters</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="avatar">D</div>
      <div>
        <div class="foot-name">Dev</div>

<div id="modalRoot"></div>

<script>
// Was frozen at 8 Sep 2026 for the prototype; real emails need the real date.
const TODAY = new Date();
const fmtMoney = (v,c='USD') => (c==='USD'?'$':c+' ') + v.toLocaleString('en-US');
const fmtDate = (d) => d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'});
const fmtDateShort = (d) => d.toLocaleDateString('en-US',{day:'2-digit',month:'short'});
const addDays = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const initials = (name) => name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

const TEAM = {
  sales:'Priya Mehta', procurement:'Karan Desai', logistics:'Ananya Rao',
  docs:'Vikram Nair', finance:'Sneha Kapoor'
};

// The 15-step canonical workflow every export order automatically follows.
// `role` decides the auto-assigned owner; `external` marks steps that wait on
// a customer/vendor/bank rather than internal action.
const STEPS = [
  {label:'Enquiry Received', stage:0, role:'sales', external:false},
  {label:'Respond to Enquiry', stage:0, role:'sales', external:false},
  {label:'Negotiation', stage:1, role:'sales', external:true},
  {label:'Issue Proforma Invoice', stage:1, role:'sales', external:false},
  {label:'Payment / LC Confirmation', stage:2, role:'finance', external:true},
  {label:'Release Purchase Orders', stage:3, role:'procurement', external:false},
  {label:'Await Supplies', stage:4, role:'procurement', external:true},
  {label:'Cargo Ready', stage:5, role:'procurement', external:false},
  {label:'Arrange Container', stage:6, role:'logistics', external:false},
  {label:'Customs Clearance', stage:6, role:'logistics', external:true},
  {label:'Shipment & Bill of Lading', stage:6, role:'logistics', external:false},
  {label:'Prepare Documentation', stage:7, role:'docs', external:false},
  {label:'Submit Documents to Bank', stage:8, role:'finance', external:false},
  {label:'Payment Realisation', stage:8, role:'finance', external:true},
  {label:'eBRC & Closure', stage:9, role:'finance', external:false},
];
const STAGES = ['Enquiry','Negotiation','Awaiting Payment / LC','Procurement','Awaiting Supplies','Cargo Ready','Logistics','Documentation','Banking','Completed'];

// Reusable mapping: document type -> the workflow step it auto-completes when
// uploaded. Add more entries here (and nothing else) to link additional
// documents to tasks later. More than one document can point at the same
// step ("Prepare Documentation" needs all three) — that step only completes
// once every document mapped to it has been uploaded.
const DOCUMENT_TASK_LINKS = [
  {docType:'Proforma Invoice', stepLabel:'Issue Proforma Invoice'},
  {docType:'LC / Deposit Proof', stepLabel:'Payment / LC Confirmation'},
  {docType:'Purchase Order', stepLabel:'Release Purchase Orders'},
  {docType:'Bill of Lading', stepLabel:'Shipment & Bill of Lading'},
  {docType:'Commercial Invoice', stepLabel:'Prepare Documentation'},
  {docType:'Packing List', stepLabel:'Prepare Documentation'},
  {docType:'Certificate of Origin', stepLabel:'Prepare Documentation'},
];
DOCUMENT_TASK_LINKS.forEach(l=>{ l.stepIndex = STEPS.findIndex(s=>s.label===l.stepLabel); });
function docTypesForStep(stepIndex){ return DOCUMENT_TASK_LINKS.filter(l=>l.stepIndex===stepIndex).map(l=>l.docType); }

// The AI Document Scanner (Feature 4) only runs against these 5 document
// types — the rest keep the simple metadata-only upload behavior above.
// Scanning needs the real file (to read and compare it), real storage, and a
// database for scan/discrepancy history, none of which the rest of this app
// uses — see /api/scan-documents and /api/scan-documents/:id/scan.
// Off for the email-intake demo: the scanner is a later release and needs its
// own API key setup. Flip to true to bring its buttons and badges back.
const SCANNER_ENABLED = false;
const SCANNABLE_DOC_TYPES = SCANNER_ENABLED ? ['Proforma Invoice','Purchase Order','Commercial Invoice','Packing List','Bill of Lading'] : [];

function healthCat(h){ if(h>=80) return {key:'good',label:'On Track'}; if(h>=50) return {key:'warn',label:'Attention Required'}; return {key:'crit',label:'Delayed / Blocked'}; }

// ---------- THE ONE SEED ORDER ----------
// Everything else in the app is created by the user via "New Export Order".
// This single fully-completed order is kept only as a worked example of what
// a closed order looks like end to end.
const RAW_ORDERS = [
  {id:'AA-2026-020', customer:'Karachi Chem Traders', country:'Pakistan', product:'Light Soda Ash', qty:'24 MT', value:41000, terms:'LC', ship:'2026-08-20', createdAt:'2026-06-25', inquiryDate:'2026-06-25', doneCount:15},
];

// ---------- AUTOMATION CORE ----------
// A due date for every step is auto-scheduled the moment an order is created,
// spread evenly between the creation date and the promised shipment date.
function computeStepDue(createdAt, shipDate){
  const span = Math.max(daysBetween(createdAt, shipDate), 14);
  const interval = span/14;
  const due = [new Date(createdAt)];
  for(let i=1;i<STEPS.length;i++) due.push(addDays(createdAt, Math.round(i*interval)));
  return due;
}

function buildOrder(cfg){
  const shipDate = new Date(cfg.ship);
  // createdAt is an automatic, non-editable system timestamp of when the
  // record was made. inquiryDate is the (editable) date the enquiry actually
  // came in — it's what drives the auto-scheduled step due-dates, since
  // inquiries are sometimes logged a day or two late.
  const createdAt = cfg.createdAt ? new Date(cfg.createdAt) : new Date(TODAY);
  const inquiryDate = cfg.inquiryDate ? new Date(cfg.inquiryDate) : createdAt;
  const stepDue = computeStepDue(inquiryDate, shipDate);
  // "Enquiry Received" completes itself the instant an order is created.
  const doneCount = cfg.doneCount!=null ? cfg.doneCount : 1;
  return {
    id:cfg.id, customer:cfg.customer, country:cfg.country, product:cfg.product,
    qty:cfg.qty, containerType:cfg.containerType, containerCount:cfg.containerCount,
    value:cfg.value, terms:cfg.terms, shipDate, createdAt, inquiryDate, stepDue, doneCount,
    // Which step indexes were completed via a linked document upload, rather
    // than a manual checkbox click — drives the "via document" badge.
    docSteps: []
  };
}

// "3 × 40 ft containers" for new-style orders; the old free-text value
// ("24 MT") is preserved and shown as-is for orders created before this
// field existed — nothing is silently dropped or migrated.
function formatQty(o){
  if(o.containerType && o.containerCount){
    const label = o.containerType==='40ft' ? '40 ft' : '20 ft';
    return `${o.containerCount} × ${label} container${o.containerCount>1?'s':''}`;
  }
  return o.qty || '—';
}

// Everything about an order's status — stage, health, next action, blocker,
// progress bar, kanban column — is computed live from doneCount + dates.
// Nothing here is stored; ticking a task off is the only input.
function getDerived(o){
  const doneCount = o.doneCount;
  const isComplete = doneCount>=STEPS.length;
  const activeIdx = Math.min(doneCount, STEPS.length-1);
  const activeStep = STEPS[activeIdx];
  const dueDate = o.stepDue[activeIdx];
  const overdue = !isComplete && TODAY > dueDate;
  const stage = isComplete ? 9 : activeStep.stage;
  const owner = TEAM[activeStep.role];
  const next = isComplete ? 'Order closed and archived.' : (activeStep.label + (activeStep.external ? ' — awaiting external party' : ''));

  let health = 100;
  if(!isComplete){
    if(overdue) health -= Math.min(45, 20 + daysBetween(dueDate,TODAY)*4);
    const daysToShip = daysBetween(TODAY, o.shipDate);
    const stepsRemaining = STEPS.length - doneCount;
    if(daysToShip < stepsRemaining) health -= Math.min(35, (stepsRemaining-daysToShip)*5);
    if(daysToShip < 0) health -= 25;
  }
  health = Math.max(5, Math.min(100, Math.round(health)));
  const cat = healthCat(health);
  const blocker = overdue ? `${activeStep.label} is overdue — was due ${fmtDate(dueDate)}. Every step after it is on hold until this clears.` : null;
  const pct = Math.round((doneCount/STEPS.length)*100);

  const steps = STEPS.map((s,i)=>{
    const status = i<doneCount ? 'completed' : (i===activeIdx && !isComplete) ? (overdue?'overdue':'active') : 'notstarted';
    const viaDocument = o.docSteps && o.docSteps.includes(i);
    return {...s, i, status, due:o.stepDue[i], viaDocument};
  });

  // Every document in the app is a task-linked upload slot. A document can
  // only be uploaded for a step that has actually been reached — i.e. every
  // step before it is already done — matching how tasks are completed
  // everywhere else in the app. When several documents map to the same step
  // ("Prepare Documentation" needs all three), the step only completes once
  // every one of them has been uploaded — uploading just one of the group
  // logs that document but doesn't check off the task by itself.
  const uploadedDocs = getUploadedDocuments(o.id);
  const linkedDocs = DOCUMENT_TASK_LINKS.map(link=>{
    const stepIndex = link.stepIndex;
    const groupDocTypes = docTypesForStep(stepIndex);
    const completed = stepIndex < doneCount;
    const locked = stepIndex > doneCount;
    const uploaded = uploadedDocs.find(u=>u.docType===link.docType) || null;
    const viaDocument = !!(o.docSteps && o.docSteps.includes(stepIndex));
    const groupUploadedCount = groupDocTypes.filter(dt=>uploadedDocs.some(u=>u.docType===dt)).length;
    const waitingOn = groupDocTypes.filter(dt=>dt!==link.docType && !uploadedDocs.some(u=>u.docType===dt));
    return {...link, completed, locked, uploaded, viaDocument, groupSize:groupDocTypes.length, groupUploadedCount, waitingOn};
  });

  return {doneCount, isComplete, activeIdx, activeStep, dueDate, overdue, stage, owner, next, health, cat, blocker, pct, steps, linkedDocs};
}

function stepStatusText(s){
  if(s.status==='completed') return 'Completed';
  if(s.status==='overdue') return `Overdue — was due ${fmtDateShort(s.due)}`;
  if(s.status==='active') return s.external ? 'Awaiting External Party' : 'In Progress';
  return 'Not started';
}

let ORDERS = RAW_ORDERS.map(buildOrder);

// ---------- SHARED DATABASE LAYER ----------
// Orders, their progress and their per-order state now live in Postgres
// (via /api/orders) so the whole team sees the same data. Everything below
// keeps an in-memory copy (ORDERS / ORDER_META) so the render code stays
// synchronous, and writes changes through to the server.
const ORDER_META = {};   // orderId -> {documents, vessel, scanDocIds, criticalBlocks}
function metaOf(orderId){ return ORDER_META[orderId] || (ORDER_META[orderId] = {}); }

const _persistChain = {};
function persistOrder(orderId){
  const o = ORDERS.find(x=>x.id===orderId);
  if(!o) return;
  const body = JSON.stringify({
    doneCount:o.doneCount, docSteps:o.docSteps||[], data:metaOf(orderId),
    raw: RAW_ORDERS.find(r=>r.id===orderId) || undefined,
  });
  // one request at a time per order, so saves can't arrive out of order
  _persistChain[orderId] = (_persistChain[orderId]||Promise.resolve()).then(async()=>{
    try{
      const res = await fetch('/api/orders/'+encodeURIComponent(orderId), {method:'PUT', headers:{'Content-Type':'application/json'}, body});
      if(!res.ok) throw new Error('HTTP '+res.status);
    }catch(e){ showToast('Could not save your change — check your connection.'); }
  });
}

function applyOrderRow(o, row){
  if(row){
    o.doneCount = row.doneCount; o.docSteps = row.docSteps || []; o.customerId = row.customerId || null;
    ORDER_META[o.id] = row.data || {};
  } else if(!ORDER_META[o.id]) ORDER_META[o.id] = {};
  return o;
}

async function loadState(){
  const res = await fetch('/api/orders', {credentials:'same-origin'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const rows = await res.json();
  const byId = {}; rows.forEach(r=>{ byId[r.id]=r; });
  const seedIds = new Set(RAW_ORDERS.map(r=>r.id));
  const fromDb = rows.filter(r=>!seedIds.has(r.id)).map(r=>applyOrderRow(buildOrder(r), r));
  const seeds = RAW_ORDERS.map(r=>applyOrderRow(buildOrder(r), byId[r.id]));
  ORDERS = [...fromDb, ...seeds];
}

function showBackendError(msg){
  const el = document.getElementById('content');
  if(!el || document.getElementById('backendBanner')) return;
  el.insertAdjacentHTML('afterbegin', `<div id="backendBanner" class="blocker-box" style="margin-bottom:16px;"><h4>Can't reach the shared database</h4><p>${msg} Showing the built-in example only — reload the page to try again.</p></div>`);
}

function saveProgress(orderId, doneCount, docSteps){
  const o = ORDERS.find(x=>x.id===orderId);
  if(!o) return;
  o.doneCount = doneCount; o.docSteps = docSteps || [];
  persistOrder(orderId);
}

// ---------- LINKED DOCUMENTS (Feature 3) ----------
// Metadata only — name, type, upload date. There's no backend here, so we
// can't actually store file bytes anywhere durable or shared; this records
// that the document was logged, not the file itself.
function getUploadedDocuments(orderId){ return metaOf(orderId).documents || []; }
function saveUploadedDocuments(orderId, docs){ metaOf(orderId).documents = docs; persistOrder(orderId); }

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 250); }, 3400);
}

// ---------- AI DOCUMENT SCANNER (Feature 4) ----------
// Everything below talks to the real backend (/api/scan-documents, ...)
// added specifically for this feature. SCAN_CACHE holds the last-fetched
// server state per order so the (synchronous) render functions above always
// have something to read, even while a fetch is in flight.
const SCAN_CACHE = {};

function getScanDocId(orderId, docType){ return (metaOf(orderId).scanDocIds||{})[docType] || null; }
function setScanDocId(orderId, docType, id){ const m=metaOf(orderId); m.scanDocIds = m.scanDocIds||{}; m.scanDocIds[docType]=id; persistOrder(orderId); }

// Steps currently reopened/blocked because their last scan found unresolved
// Critical discrepancies — separate from docSteps, which just tracks
// "completed via document upload".
function getCriticalBlocks(orderId){ return metaOf(orderId).criticalBlocks || []; }
function setCriticalBlocks(orderId, arr){ metaOf(orderId).criticalBlocks = arr; persistOrder(orderId); }

function scanCacheEntry(orderId, docType){
  const docId = getScanDocId(orderId, docType);
  if(!docId) return null;
  return (SCAN_CACHE[orderId]||[]).find(d=>d.id===docId) || null;
}

function scanStatusBadge(entry){
  if(!entry) return `<span class="pill pill-neutral">Not scanned</span>`;
  if(entry._scanning) return `<span class="pill pill-neutral">Scanning…</span>`;
  const scan = entry.latestScan;
  if(!scan) return `<span class="pill pill-neutral">Not scanned</span>`;
  if(scan.status==='FAILED') return `<span class="pill pill-crit">Scan failed</span>`;
  if(scan.status==='CRITICAL') return `<span class="pill pill-crit">Critical issues</span>`;
  if(scan.status==='WARNINGS') return `<span class="pill pill-warn">Warnings</span>`;
  return `<span class="pill pill-good">Clean</span>`;
}

const SEVERITY_ORDER = {CRITICAL:0, WARNING:1, INFO:2};
function renderDiscrepancyPanel(entry, orderId, docType){
  if(!entry || entry._scanning) return '';
  const scan = entry.latestScan;
  if(!scan) return '';
  if(scan.status==='FAILED') return `<div class="locked-hint" style="color:var(--crit-text); margin-top:6px;">Scan failed: ${scan.errorMessage||'unknown error'}</div>`;
  const discs = scan.discrepancies || [];
  if(!discs.length) return `<div class="locked-hint" style="color:var(--good-text); margin-top:6px;">No discrepancies found.</div>`;
  const sorted = [...discs].sort((a,b)=>SEVERITY_ORDER[a.severity]-SEVERITY_ORDER[b.severity]);
  return `<div class="subtle-card" style="margin-top:8px;">
    ${sorted.map(disc=>{
      const sevClass = disc.severity==='CRITICAL'?'pill-crit':disc.severity==='WARNING'?'pill-warn':'pill-neutral';
      const resolved = disc.status!=='OPEN';
      return `<div style="padding:8px 0; border-top:1px solid var(--border);">
        <div style="display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap;">
          <span class="pill ${sevClass}">${disc.severity}</span>
          <span style="font-size:11.5px; font-weight:600; flex:1;">${disc.field}</span>
          ${resolved?`<span class="pill pill-neutral">${disc.status}</span>`:''}
        </div>
        <div style="font-size:11.3px; color:var(--text-2); margin-top:4px;">
          Found: <strong>${disc.foundValue ?? '—'}</strong> (${disc.foundSource}) · Expected: <strong>${disc.expectedValue ?? '—'}</strong> (${disc.expectedSource})
        </div>
        ${!resolved?`<div style="margin-top:6px; display:flex; gap:6px;">
          <button class="btn" style="padding:4px 9px; font-size:11px;" data-review-disc="${disc.id}:RESOLVED:${orderId}:${docType}">Resolved</button>
          <button class="btn" style="padding:4px 9px; font-size:11px;" data-review-disc="${disc.id}:IGNORED:${orderId}:${docType}">Ignore</button>
        </div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

async function refreshScanCache(orderId){
  try{
    const res = await fetch(`/api/scan-documents?orderId=${encodeURIComponent(orderId)}`);
    if(res.ok) SCAN_CACHE[orderId] = await res.json();
  }catch(e){ /* keep whatever was cached before */ }
  route();
}

function buildOrderRecordForScan(o){
  return {
    id: o.id,
    customer: o.customer,
    product: o.product,
    containerType: o.containerType || null,
    containerCount: o.containerCount || null,
    value: o.value,
    currency: 'USD',
    shipDate: o.shipDate ? o.shipDate.toISOString().slice(0,10) : null,
  };
}

async function uploadScannableDocument(orderId, docType, file){
  const o = ORDERS.find(x=>x.id===orderId);
  const link = DOCUMENT_TASK_LINKS.find(l=>l.docType===docType);
  if(!o || !link || !file) return;
  const stepIndex = link.stepIndex;
  if(stepIndex > o.doneCount) return; // guarded in the UI too; safety no-op

  showToast(`Uploading ${docType}…`);
  const fd = new FormData();
  fd.append('file', file);
  fd.append('orderId', orderId);
  fd.append('docType', docType);

  let doc;
  try{
    const res = await fetch('/api/scan-documents', { method:'POST', body: fd });
    const body = await res.json().catch(()=>({}));
    if(!res.ok){ showToast(`Upload failed: ${body.error || res.statusText}`); return; }
    doc = body;
  }catch(e){ showToast('Upload failed — network error.'); return; }

  setScanDocId(orderId, docType, doc.id);

  // Same bookkeeping the metadata-only path uses, so the existing
  // task/workflow sync (Feature 3) works identically either way.
  const docs = getUploadedDocuments(orderId).filter(d=>d.docType!==docType);
  docs.push({docType, fileName: file.name, uploadedAt: new Date().toISOString()});
  saveUploadedDocuments(orderId, docs);

  const groupDocTypes = docTypesForStep(stepIndex);
  const groupComplete = groupDocTypes.every(dt=>docs.some(d=>d.docType===dt));
  let toast = `${docType} uploaded.`;
  if(!groupComplete){
    const stillNeeded = groupDocTypes.filter(dt=>!docs.some(d=>d.docType===dt));
    toast = `${docType} uploaded — still need ${stillNeeded.join(', ')} to complete "${link.stepLabel}".`;
  } else if(stepIndex === o.doneCount){
    o.doneCount++;
    if(!o.docSteps.includes(stepIndex)) o.docSteps.push(stepIndex);
    toast = `${docType} uploaded — "${link.stepLabel}" marked complete. Click Scan to check it for discrepancies.`;
  }
  saveProgress(orderId, o.doneCount, o.docSteps);
  showToast(toast);
  await refreshScanCache(orderId);
}

function blockStepForCriticalIssues(orderId, docType){
  const o = ORDERS.find(x=>x.id===orderId);
  const link = DOCUMENT_TASK_LINKS.find(l=>l.docType===docType);
  if(!o || !link) return;
  const stepIndex = link.stepIndex;
  // If this step had already auto-completed on upload, reopen it — per your
  // call, Critical issues block completion until they're resolved.
  if(o.docSteps.includes(stepIndex) && stepIndex === o.doneCount-1){
    o.doneCount--;
    o.docSteps = o.docSteps.filter(i=>i!==stepIndex);
    saveProgress(orderId, o.doneCount, o.docSteps);
  }
  const blocks = getCriticalBlocks(orderId);
  if(!blocks.includes(stepIndex)) blocks.push(stepIndex);
  setCriticalBlocks(orderId, blocks);
}

function maybeUnblockStep(orderId, docType){
  const o = ORDERS.find(x=>x.id===orderId);
  const link = DOCUMENT_TASK_LINKS.find(l=>l.docType===docType);
  if(!o || !link) return;
  const stepIndex = link.stepIndex;
  const blocks = getCriticalBlocks(orderId);
  if(!blocks.includes(stepIndex)) return;

  const entry = scanCacheEntry(orderId, docType);
  if(entry && entry.openCritical > 0) return; // still has unresolved critical issues

  setCriticalBlocks(orderId, blocks.filter(i=>i!==stepIndex));

  const groupDocTypes = docTypesForStep(stepIndex);
  const uploadedDocs = getUploadedDocuments(orderId);
  const groupComplete = groupDocTypes.every(dt=>uploadedDocs.some(d=>d.docType===dt));
  const stillBlocked = getCriticalBlocks(orderId).includes(stepIndex);
  if(groupComplete && !stillBlocked && stepIndex === o.doneCount){
    o.doneCount++;
    if(!o.docSteps.includes(stepIndex)) o.docSteps.push(stepIndex);
    saveProgress(orderId, o.doneCount, o.docSteps);
    showToast(`All critical issues resolved — "${link.stepLabel}" marked complete.`);
  }
}

async function runScan(orderId, docType){
  const docId = getScanDocId(orderId, docType);
  if(!docId){ showToast('Upload the document before scanning.'); return; }
  const o = ORDERS.find(x=>x.id===orderId);

  SCAN_CACHE[orderId] = (SCAN_CACHE[orderId]||[]).map(d=> d.id===docId ? {...d, _scanning:true} : d);
  route();

  let scan;
  try{
    const res = await fetch(`/api/scan-documents/${docId}/scan`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ order: buildOrderRecordForScan(o) }),
    });
    scan = await res.json().catch(()=>({}));
    if(!res.ok){ showToast(`Scan failed: ${scan.error || res.statusText}`); await refreshScanCache(orderId); return; }
  }catch(e){ showToast('Scan failed — network error.'); await refreshScanCache(orderId); return; }

  if(scan.status === 'FAILED') showToast(`Scan failed: ${scan.errorMessage || 'unknown error'}.`);
  else if(scan.status === 'CRITICAL'){ showToast(`Scan found Critical issues in ${docType}.`); blockStepForCriticalIssues(orderId, docType); }
  else if(scan.status === 'WARNINGS') showToast(`Scan found Warnings in ${docType}.`);
  else showToast(`${docType} scanned clean — no discrepancies found.`);

  await refreshScanCache(orderId);
}

async function scanAllForOrder(orderId){
  const entries = SCANNABLE_DOC_TYPES.map(dt=>({dt, id:getScanDocId(orderId, dt)})).filter(x=>x.id);
  if(!entries.length){ showToast('No scannable documents uploaded yet.'); return; }
  for(const {dt} of entries) await runScan(orderId, dt);
}

async function reviewDiscrepancy(discrepancyId, status, orderId, docType){
  try{
    const res = await fetch(`/api/scan-discrepancies/${discrepancyId}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status }),
    });
    if(!res.ok){ showToast('Could not update discrepancy.'); return; }
  }catch(e){ showToast('Could not update discrepancy — network error.'); return; }
  await refreshScanCache(orderId);
  maybeUnblockStep(orderId, docType);
}

// Uploading is atomic (document record + task completion + workflow all
// update together, in one synchronous pass) and idempotent (re-uploading the
// same document type replaces its record instead of duplicating, and won't
// double-advance a step that's already done).
function uploadLinkedDocument(orderId, docType, fileName){
  const o = ORDERS.find(x=>x.id===orderId);
  const link = DOCUMENT_TASK_LINKS.find(l=>l.docType===docType);
  if(!o || !link) return;
  const stepIndex = link.stepIndex;
  if(stepIndex > o.doneCount) return; // guarded in the UI too; safety no-op

  const docs = getUploadedDocuments(orderId).filter(d=>d.docType!==docType);
  docs.push({docType, fileName, uploadedAt: new Date().toISOString()});
  saveUploadedDocuments(orderId, docs);

  // A step only completes once every document mapped to it is uploaded —
  // for a single-document step that's just this one.
  const groupDocTypes = docTypesForStep(stepIndex);
  const groupComplete = groupDocTypes.every(dt=>docs.some(d=>d.docType===dt));

  let toast = `${docType} logged.`;
  if(!groupComplete){
    const stillNeeded = groupDocTypes.filter(dt=>!docs.some(d=>d.docType===dt));
    toast = `${docType} logged — still need ${stillNeeded.join(', ')} to complete "${link.stepLabel}".`;
  } else if(stepIndex === o.doneCount){
    o.doneCount++;
    if(!o.docSteps.includes(stepIndex)) o.docSteps.push(stepIndex);
    toast = `${docType} uploaded — "${link.stepLabel}" marked complete.`;
  }
  saveProgress(orderId, o.doneCount, o.docSteps);
  showToast(toast);
  route();
}

function deleteLinkedDocument(orderId, docType){
  const o = ORDERS.find(x=>x.id===orderId);
  const link = DOCUMENT_TASK_LINKS.find(l=>l.docType===docType);
  if(!o || !link) return;
  const stepIndex = link.stepIndex;
  const docs = getUploadedDocuments(orderId).filter(d=>d.docType!==docType);
  saveUploadedDocuments(orderId, docs);

  // Only revert the task if this is still the most recently completed step —
  // if later steps have already progressed, rolling all the way back would
  // silently undo unrelated work, so we just remove the document record.
  // Removing any one document from a multi-document group breaks the group's
  // "all uploaded" requirement, so it reverts the shared task too.
  const wasDocCompleted = o.docSteps.includes(stepIndex);
  if(wasDocCompleted && stepIndex === o.doneCount-1){
    o.doneCount--;
    o.docSteps = o.docSteps.filter(i=>i!==stepIndex);
    saveProgress(orderId, o.doneCount, o.docSteps);
    showToast(`${docType} removed — "${link.stepLabel}" reverted to not done.`);
  } else {
    o.docSteps = o.docSteps.filter(i=>i!==stepIndex);
    saveProgress(orderId, o.doneCount, o.docSteps);
    showToast(`${docType} removed. Later steps are already complete, so the task stays marked done.`);
  }
  route();
}
// A worked example so the MarineTraffic deep-link can be seen without typing
// anything in — a real, currently-trackable vessel (IMO verified against
// marinetraffic.com), attached only to the one seed example order.
const SEED_VESSELS = { 'AA-2026-020': {name:'Ever Given', imo:'9811000'} };
function getVessel(orderId){
  const m = metaOf(orderId);
  if(Object.prototype.hasOwnProperty.call(m, 'vessel')) return m.vessel;
  return SEED_VESSELS[orderId] || null;
}
function saveVessel(orderId, vessel){ metaOf(orderId).vessel = vessel; persistOrder(orderId); }
function marineTrafficUrl(imo){ return `https://www.marinetraffic.com/en/ais/details/ships/imo:${encodeURIComponent(imo)}`; }

// One live, actionable task per open order — the step currently active.
// Ticking it off is what advances that order's workflow bar.
function actionTasks(){
  return ORDERS.map(o=>({o,d:getDerived(o)})).filter(x=>!x.d.isComplete).map(x=>({
    name:x.d.activeStep.label, orderId:x.o.id, orderCustomer:x.o.customer,
    status: x.d.overdue?'overdue': (x.d.activeStep.external?'awaiting':'inprogress'),
    due:x.d.dueDate, owner:x.d.owner
  }));
}

const NAV = [
  {group:'Overview', items:[['dashboard','Dashboard','#/dashboard']]},
  {group:'Operations', items:[['inbox','Inquiries','#/inquiries'],['orders','Export Orders','#/orders'],['tasks','Tasks','#/tasks'],['suppliers','Suppliers','#/suppliers'],['customers','Customers','#/customers'],['documents','Documents','#/documents'],['calendar','Calendar','#/calendar']]},
  {group:'Intelligence', items:[['analytics','Analytics','#/analytics'],['ai','AI Assistant','#/ai']]},
  {group:'', items:[['settings','Settings','#/settings']]},
];

function renderNav(){
  const hash = location.hash || '#/dashboard';
  const overdue = actionTasks().filter(t=>t.status==='overdue').length;
  document.getElementById('nav').innerHTML = NAV.map(g=>`
    ${g.group?`<div class="nav-group-label">${g.group}</div>`:''}
    ${g.items.map(([ic,label,href])=>{
      const active = hash===href || (href==='#/orders' && hash.startsWith('#/orders')) || (href==='#/customers' && hash.startsWith('#/customers/'));
      const badge = (label==='Tasks' && overdue>0) ? `<span class="nav-badge">${overdue}</span>` : (label==='Inquiries' && openInquiryCount()>0) ? `<span class="nav-badge">${openInquiryCount()}</span>` : '';
      return `<a class="nav-link ${active?'active':''}" href="${href}">${icon(ic)}<span>${label}</span>${badge}</a>`;
    }).join('')}
  `).join('');
}

// ---------- SHARED WIDGETS ----------
function pill(cat){
  const map={good:['pill-good','On Track'],warn:['pill-warn','Attention'],crit:['pill-crit','At Risk']};
  const [cls,label] = map[cat.key] || map.good;
  return `<span class="pill ${cls}"><span class="pill-dot" style="background:currentColor"></span>${cat.label||label}</span>`;
}
function statusPill(status){
  const map = {
    done:['pill-good','Completed'], completed:['pill-good','Completed'],
    inprogress:['pill-neutral','In Progress'],
    awaiting:['pill-warn','Awaiting External'], overdue:['pill-crit','Overdue'],
    notstarted:['pill-neutral','Not Started'],
  };
  const [cls,label] = map[status]||map.notstarted;
  return `<span class="pill ${cls}">${label}</span>`;
}
function healthRing(h){
  const cat = healthCat(h);
  const color = `var(--${cat.key==='good'?'good':cat.key==='warn'?'warn':'crit'})`;
  const r=24, c=2*Math.PI*r, off = c*(1-h/100);
  return `<svg class="ring" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 28 28)"/>
    <text x="28" y="31" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="var(--text)">${h}</text>
  </svg>`;
}
function ownerChip(name){
  return `<span class="owner-chip"><span class="owner-dot">${initials(name)}</span>${name}</span>`;
}

// ---------- ROUTER ----------
function route(){
  renderNav();
  const hash = location.hash || '#/dashboard';
  const parts = hash.replace('#/','').split('/');
  const page = parts[0];
  const el = document.getElementById('content');
  const titles = {dashboard:'Dashboard', orders: parts[1]?'Order Detail':'Export Orders', tasks:'Tasks', suppliers:'Suppliers', customers: parts[1]?'Customer Folder':'Customers', inquiries:'New Inquiry Board', documents:'Documents', calendar:'Calendar', analytics:'Analytics', ai:'AI Assistant', settings:'Settings'};
  document.getElementById('pageTitle').textContent = titles[page] || 'AfroFlow';

  if(page==='dashboard') el.innerHTML = viewDashboard();
  else if(page==='orders' && parts[1]) el.innerHTML = viewOrderDetail(parts[1]);
  else if(page==='orders') el.innerHTML = viewOrders();
  else if(page==='tasks') el.innerHTML = viewTasks();
  else if(page==='suppliers') el.innerHTML = viewSuppliers();
  else if(page==='customers' && parts[1]) el.innerHTML = viewCustomerFolder(parts[1]);
  else if(page==='customers') el.innerHTML = viewCustomers();
  else if(page==='inquiries') el.innerHTML = viewInquiries();
  else if(page==='documents') el.innerHTML = viewDocuments();
  else if(page==='calendar') el.innerHTML = viewCalendar();
  else if(page==='analytics') el.innerHTML = viewAnalytics();
  else if(page==='ai') el.innerHTML = viewAI();
  else if(page==='settings') el.innerHTML = viewSettings();
  else el.innerHTML = viewDashboard();

  window.scrollTo(0,0);
  afterRender(page, parts[1]);
}

// ---------- DASHBOARD ----------
function viewDashboard(){
  const rows = ORDERS.map(o=>({o,d:getDerived(o)}));
  const active = rows.filter(x=>!x.d.isComplete);
  const onTrack = active.filter(x=>x.d.cat.key==='good').length;
  const attention = active.filter(x=>x.d.cat.key==='warn').length;
  const atRisk = active.filter(x=>x.d.cat.key==='crit').length;
  const pendingValue = active.reduce((s,x)=>s+x.o.value,0);
  const shipWeek = active.filter(x=>{ const dd=daysBetween(TODAY,x.o.shipDate); return dd>=0 && dd<=7; }).length;

  const urgent = active.filter(x=>x.d.cat.key==='crit').sort((a,b)=>a.d.health-b.d.health).slice(0,4);
  const todayTasks = actionTasks().sort((a,b)=>a.due-b.due).slice(0,6);
  const stageCounts = STAGES.map((s,i)=> active.filter(x=>x.d.stage===i).length);

  return `
  <div style="margin-bottom:22px;">
    <h2 style="font-size:20px;">Good morning, Dev</h2>
    <div style="color:var(--text-muted); font-size:13px; margin-top:3px;">Afro Asiatic Export Operations — ${TODAY.toLocaleDateString('en-US',{weekday:'long', day:'numeric', month:'long'})}</div>
  </div>
  <div class="grid-stats">
    <div class="stat-tile"><div class="stat-label">Active Orders<span class="stat-dot" style="background:var(--accent)"></span></div><div class="stat-value">${active.length}</div><div class="stat-sub">${onTrack} on track</div></div>
    <div class="stat-tile"><div class="stat-label">Orders At Risk<span class="stat-dot" style="background:var(--crit)"></span></div><div class="stat-value" style="color:var(--crit)">${atRisk}</div><div class="stat-sub">${attention} need attention</div></div>
    <div class="stat-tile"><div class="stat-label">Tasks Due Today<span class="stat-dot" style="background:var(--warn)"></span></div><div class="stat-value">${todayTasks.length}</div><div class="stat-sub">${actionTasks().filter(t=>t.status==='overdue').length} overdue</div></div>
    <div class="stat-tile"><div class="stat-label">Pending Order Value<span class="stat-dot" style="background:var(--good)"></span></div><div class="stat-value">$${Math.round(pendingValue/1000)}k</div><div class="stat-sub">across ${active.length} open orders</div></div>
    <div class="stat-tile"><div class="stat-label">Shipments This Week<span class="stat-dot" style="background:var(--accent)"></span></div><div class="stat-value">${shipWeek}</div><div class="stat-sub">next 7 days</div></div>
  </div>

  <div class="two-col">
    <div class="stack" style="gap:20px;">
      <div>
        <div class="section-head"><h2>Orders Requiring Attention</h2><span class="link" data-nav="#/orders">View all orders →</span></div>
        <div class="card divide">
          ${urgent.length? urgent.map(x=>`
            <div class="priority-row" data-nav="#/orders/${x.o.id}">
              <div class="priority-stripe" style="background:var(--crit)"></div>
              <div class="priority-body">
                <div class="priority-top"><span class="order-id">${x.o.id}</span>${pill(x.d.cat)}</div>
                <div class="priority-title">${x.o.customer} · ${x.o.country}</div>
                <div class="priority-desc">${x.d.blocker || x.d.next}</div>
                <div class="priority-meta"><span>Shipment in ${daysBetween(TODAY,x.o.shipDate)}d</span><span>·</span><span>Owner: ${x.d.owner}</span></div>
              </div>
              <button class="btn" style="flex:none;" data-nav="#/orders/${x.o.id}">Review</button>
            </div>`).join('') : `<div class="empty">No urgent orders right now.</div>`}
        </div>
      </div>
      <div>
        <div class="section-head"><h2>Export Pipeline</h2><span class="link" data-nav="#/orders">Kanban view →</span></div>
        <div class="pipeline-strip">
          ${STAGES.map((s,i)=>`<div class="pipeline-stage"><div class="pipeline-count">${stageCounts[i]}</div><div class="pipeline-label">${s}</div></div>`).join('')}
        </div>
      </div>
    </div>
    <div>
      <div class="section-head"><h2>Today's Tasks</h2><span class="link" data-nav="#/tasks">All tasks →</span></div>
      <div class="card divide">
        ${todayTasks.length? todayTasks.map(t=>`
          <div class="task-row">
            <div class="task-check" data-advance="${t.orderId}" title="Mark this step complete"></div>
            <div style="min-width:0;">
              <div class="task-name">${t.name}</div>
              <div class="task-order">${t.orderId} · ${t.orderCustomer}</div>
            </div>
            <div class="task-meta">${statusPill(t.status)}</div>
          </div>`).join('') : `<div class="empty">Nothing due today.</div>`}
      </div>
      ${!ORDERS.some(o=>getDerived(o).isComplete===false) ? '' : ''}

  </div>`;

let ordersViewMode = 'table';
let ordersFilters = {q:'', stage:'', health:''};

function viewOrders(){
  const stageOptions = STAGES.map((s,i)=>`<option value="${i}">${s}</option>`).join('');
  return `
  <div class="toolbar">
    <input class="select" style="min-width:200px;" id="ordersSearch" placeholder="Filter by customer or country…" value="${ordersFilters.q}">
    <select class="select" id="stageFilter"><option value="">All Stages</option>${stageOptions}</select>
    <select class="select" id="healthFilter">
      <option value="">All Health</option>
      <option value="good">On Track</option>
      <option value="warn">Attention</option>
      <option value="crit">At Risk</option>
    </select>
    <div class="viewtoggle" style="margin-left:auto;">
      <button data-view="table" class="${ordersViewMode==='table'?'active':''}">Table</button>
      <button data-view="kanban" class="${ordersViewMode==='kanban'?'active':''}">Kanban</button>
    </div>
  </div>
  <div id="ordersContainer"></div>`;
}

function filteredOrders(){
  return ORDERS.filter(o=>{
    const d = getDerived(o);
    if(ordersFilters.q){
      const q = ordersFilters.q.toLowerCase();
      if(!(o.customer.toLowerCase().includes(q) || o.country.toLowerCase().includes(q) || o.id.toLowerCase().includes(q))) return false;
    }
    if(ordersFilters.stage!=='' && d.stage!==Number(ordersFilters.stage)) return false;
    if(ordersFilters.health && d.cat.key!==ordersFilters.health) return false;
    return true;
  });
}

function renderOrdersContainer(){
  const box = document.getElementById('ordersContainer');
  if(!box) return;
  const list = filteredOrders();
  box.innerHTML = ordersViewMode==='table' ? ordersTable(list) : ordersKanban(list);
}
