        <h3 style="font-size:13.5px; margin-bottom:14px;">Next Required Action</h3>
        <p style="font-size:14px; font-weight:500; margin:0 0 4px;">${d.next}</p>
        <p style="font-size:12.5px; color:var(--text-muted); margin:0;">Owned by ${d.owner} · due ${fmtDate(d.dueDate)}</p>
        <div style="margin-top:18px; padding-top:16px; border-top:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:6px;"><span>Overall progress</span><span>${d.pct}%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${d.pct}%; background:var(--${d.cat.key})"></div></div>
          <p style="font-size:11.3px; color:var(--text-muted); margin:8px 0 0;">Auto-advances as each step in the Tasks tab is checked off.</p>
        </div>
      </div>
      <div class="card" style="padding:18px 20px;">
        <h3 style="font-size:13.5px; margin-bottom:12px;">Order Summary</h3>
        <div class="stack" style="gap:10px; font-size:12.8px;">
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Product</span><span style="font-weight:600;">${o.product}</span></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Current Stage</span><span style="font-weight:600;">${STAGES[d.stage]}</span></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Inquiry Received</span><span style="font-weight:600;">${fmtDateShort(o.inquiryDate)}</span></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Order Created</span><span style="font-weight:600;">${fmtDateShort(o.createdAt)}</span></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Days to Shipment</span><span style="font-weight:600;">${daysBetween(TODAY,o.shipDate)}d</span></div>
        </div>
      </div>
    </div>`;

  if(tab==='workflow') return `<div class="card" style="padding:22px 24px;"><div class="stepper">
    ${d.steps.map((s,i)=>`
      <div class="step">
        <div class="step-rail">
          <div class="step-dot ${s.status==='completed'?'done':s.status==='overdue'?'blocked':s.status==='active'?'current':''}">
            ${s.status==='completed'?'✓':(s.status==='overdue'?'!':s.status==='active'?'●':'')}
          </div>
          ${i<d.steps.length-1?`<div class="step-line ${s.status==='completed'?'done':''}"></div>`:''}
        </div>
        <div class="step-body">
          <div class="step-title">${s.label}</div>
          <div class="step-status" style="color:${s.status==='completed'?'var(--good)':s.status==='overdue'?'var(--crit)':s.status==='active'?'var(--accent)':'var(--text-muted)'}">${stepStatusText(s)}${s.viaDocument?' · via document':''}</div>
        </div>
      </div>`).join('')}
  </div></div>`;

  if(tab==='tasks') return `<div class="card divide">
    ${d.steps.map((s,i)=>{
      const clickable = i===d.doneCount || i===d.doneCount-1;
      const done = s.status==='completed';
      return `
      <div class="task-row">
        <div class="task-check ${done?'done':''} ${clickable?'':'disabled'}" ${clickable?`data-step-toggle="${o.id}:${i}"`:''}>${done?'<svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>':''}</div>
        <div style="min-width:0;">
          <div class="task-name ${done?'done':''} ${s.status==='notstarted'?'future':''}">${s.label}${s.external?' <span style="color:var(--text-muted); font-weight:400;">(awaiting external party)</span>':''}${s.viaDocument?' <span class="pill pill-neutral" style="margin-left:6px; font-size:10px; padding:2px 7px;">via document</span>':''}</div>
          <div class="task-order">Due ${fmtDateShort(s.due)} · ${TEAM[s.role]}</div>
        </div>
        <div class="task-meta">${statusPill(done?'completed':s.status==='overdue'?'overdue':s.status==='active'?(s.external?'awaiting':'inprogress'):'notstarted')}</div>
      </div>`;
    }).join('')}
  </div>`;

  if(tab==='documents'){
    const criticalBlocks = getCriticalBlocks(o.id);
    const hasScannable = d.linkedDocs.some(l=>SCANNABLE_DOC_TYPES.includes(l.docType) && !l.locked);
    return `
    ${hasScannable ? `<div class="toolbar" style="margin-bottom:16px;">
      <div style="font-size:12.3px; color:var(--text-muted);">AI Document Scanner reads uploaded documents and checks them against the order and each other.</div>
      <button class="btn" style="margin-left:auto;" data-scan-all="${o.id}">Scan All</button>
    </div>` : ''}
    <div class="doclist">
      ${d.linkedDocs.map(l=>{
        const inputId = `fileInput_${o.id}_${l.docType.replace(/\s+/g,'')}`;
        const groupNote = l.groupSize>1 ? `<div class="locked-hint">Part of "${l.stepLabel}" — needs all ${l.groupSize} documents (${l.groupUploadedCount}/${l.groupSize} uploaded)</div>` : '';
        const scannable = SCANNABLE_DOC_TYPES.includes(l.docType);
        const blocked = criticalBlocks.includes(l.stepIndex);
        if(l.locked){
          const prevLabel = STEPS[l.stepIndex-1]?.label;
          return `<div class="doc-item" style="opacity:.55;">
            <div class="doc-name">${l.docType}</div>
            <span class="pill pill-neutral">Locked</span>
            <div class="locked-hint">Complete "${prevLabel}" first</div>
          </div>`;
        }
        if(l.uploaded){
          const waiting = l.waitingOn.length ? `<div class="locked-hint">Still waiting on ${l.waitingOn.join(', ')}.</div>` : '';
          const entry = scannable ? scanCacheEntry(o.id, l.docType) : null;
          return `<div class="doc-item">
            <div class="doc-name">${l.docType}</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
              <span class="pill pill-good">${l.viaDocument?'Uploaded':'Logged manually'}</span>
              ${scannable ? scanStatusBadge(entry) : ''}
            </div>
            <div class="locked-hint">${l.uploaded.fileName} · ${fmtDateShort(new Date(l.uploaded.uploadedAt))}</div>
            ${groupNote}${waiting}
            ${blocked ? `<div class="locked-hint" style="color:var(--crit-text);">Critical issues found — task reopened until resolved below.</div>` : ''}
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${scannable ? `<button class="btn btn-primary" style="padding:5px 10px; font-size:11.5px;" data-scan-doc="${o.id}:${l.docType}" ${entry && entry._scanning ? 'disabled' : ''}>${entry && entry._scanning ? 'Scanning…' : 'Scan'}</button>` : ''}
              <button class="btn" style="padding:5px 10px; font-size:11.5px;" data-delete-doc="${o.id}:${l.docType}">Remove</button>
            </div>
            ${scannable ? renderDiscrepancyPanel(entry, o.id, l.docType) : ''}
          </div>`;
        }
        return `<div class="doc-item">
          <div class="doc-name">${l.docType}</div>
          <span class="pill pill-crit">Not Uploaded</span>
          ${l.completed?`<div class="locked-hint">Task already completed manually — attach the document for your records.</div>`:groupNote}
          <input type="file" id="${inputId}" style="font-size:11.3px;" ${scannable?'accept="application/pdf,image/png,image/jpeg,image/webp"':''}>
          <button class="btn btn-primary" style="padding:6px 10px; font-size:11.5px; align-self:flex-start;" data-upload-doc="${o.id}:${l.docType}">Upload</button>
        </div>`;
      }).join('')}
    </div>`;
  }

  if(tab==='suppliers'){
    const procurementStage = d.stage>=3 && d.stage<=5;
    return `<div class="card"><div class="empty">${procurementStage
      ? `Order is in ${STAGES[d.stage]} — vendor entries recorded by Procurement for this order will appear here.`
      : `No vendor coordination needed at this stage yet (currently ${STAGES[d.stage]}).`}</div></div>`;
  }

  if(tab==='shipment'){
    const etd = addDays(o.shipDate,-2), eta = addDays(o.shipDate,16);
    const vessel = getVessel(o.id);
    const voyageStarted = d.stage>=6;
    let voyagePct = null;
    if(voyageStarted){
      const span = daysBetween(etd,eta) || 1;
      voyagePct = Math.max(0, Math.min(100, Math.round((daysBetween(etd,TODAY)/span)*100)));
    }
    return `<div class="card" style="padding:18px 20px; margin-bottom:16px;"><div class="detail-grid" style="margin-top:0; border-top:none; padding-top:0;">
      <div><div class="dg-label">Port of Loading</div><div class="dg-value">Nhava Sheva, India</div></div>
      <div><div class="dg-label">Port of Discharge</div><div class="dg-value">${o.country}</div></div>
      <div><div class="dg-label">Shipping Line</div><div class="dg-value">${['Maersk','MSC','CMA CGM','Hapag-Lloyd'][o.id.charCodeAt(8)%4]}</div></div>
      <div><div class="dg-label">ETD</div><div class="dg-value mono">${fmtDateShort(etd)}</div></div>
      <div><div class="dg-label">ETA</div><div class="dg-value mono">${fmtDateShort(eta)}</div></div>
      <div><div class="dg-label">Container Status</div><div class="dg-value">${d.stage>=6?'Confirmed':'Not yet requested'}</div></div>
    </div></div>
    <div class="card" style="padding:18px 20px;">
      <h3 style="font-size:13.5px; margin-bottom:4px;">Vessel Tracking</h3>
      <p style="font-size:11.8px; color:var(--text-muted); margin:0 0 14px;">Live AIS position comes from MarineTraffic, not from AfroFlow — record the vessel's IMO number here once it's assigned, then jump straight to its live position.</p>
      ${vessel ? `
        <div class="field-row" style="margin-bottom:0;">
          <div><div class="dg-label">Vessel Name</div><div class="dg-value">${vessel.name}</div></div>
          <div><div class="dg-label">IMO Number</div><div class="dg-value mono">${vessel.imo}</div></div>
        </div>
        ${voyageStarted ? `
        <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:6px;"><span>Estimated voyage progress (from ETD/ETA schedule)</span><span>${voyagePct}%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${voyagePct}%; background:var(--accent)"></div></div>
          <p style="font-size:11.3px; color:var(--text-muted); margin:8px 0 0;">This is a schedule-based estimate, not the vessel's real GPS position — open MarineTraffic below for that.</p>
        </div>` : ''}
        <div style="margin-top:16px; display:flex; gap:9px; flex-wrap:wrap;">
          <a class="btn btn-primary" href="${marineTrafficUrl(vessel.imo)}" target="_blank" rel="noopener noreferrer">Track Live on MarineTraffic ↗</a>
          <button class="btn" data-edit-vessel="${o.id}">Edit Vessel</button>
        </div>
      ` : `
        <div class="field-row">
          <div class="field" style="margin-bottom:0;"><label>Vessel Name</label><input id="vesselNameInput" placeholder="e.g. MSC Vista"></div>
          <div class="field" style="margin-bottom:0;"><label>IMO Number</label><input id="vesselImoInput" placeholder="e.g. 9811000"></div>
        </div>
        <button class="btn btn-primary" style="margin-top:12px;" data-save-vessel="${o.id}">Save Vessel</button>
      `}
    </div>`;
  }

  if(tab==='payment') return `<div class="card" style="padding:18px 20px;"><div class="detail-grid" style="margin-top:0; border-top:none; padding-top:0;">
    <div><div class="dg-label">Payment Terms</div><div class="dg-value">${o.terms}</div></div>
    <div><div class="dg-label">Order Value</div><div class="dg-value mono">${fmtMoney(o.value)}</div></div>
    <div><div class="dg-label">Status</div><div class="dg-value">${d.stage>=8?'Realised':d.stage>=2?(o.terms==='LC'?'LC Accepted':'Deposit Received'):'Pending'}</div></div>
    <div><div class="dg-label">Outstanding</div><div class="dg-value mono">${d.stage>=9?fmtMoney(0):fmtMoney(o.value)}</div></div>
  </div></div>`;

  if(tab==='activity'){
    const items = [{date:o.createdAt, text:'Enquiry received — order created'}];
    for(let i=1;i<d.doneCount;i++) items.push({date:o.stepDue[i], text:`${STEPS[i].label} completed`});
    (ACTIVITY_CACHE[o.id]||[]).forEach(a=> items.push({date:new Date(a.createdAt), text:esc(a.text)}));
    items.sort((a,b)=>a.date-b.date);
    return `<div class="card" style="padding:22px 24px;"><div class="timeline">
      ${items.map(t=>`<div class="tl-item"><div class="tl-date">${fmtDate(t.date)}</div><div class="tl-text">${t.text}</div></div>`).join('')}
    </div></div>`;
  }
  return '';
}

// ---------- TASKS ----------
let taskFilter = 'all';
function viewTasks(){
  const filters = [['all','All'],['overdue','Overdue'],['awaiting','Awaiting External'],['inprogress','In Progress']];
  return `
  <div class="toolbar">
    ${filters.map(([k,l])=>`<button class="btn ${taskFilter===k?'btn-primary':''}" data-task-filter="${k}" style="padding:6px 12px; font-size:12.3px;">${l}</button>`).join('')}
  </div>
  <div id="tasksContainer"></div>`;
}
function renderTasksContainer(){
  const box = document.getElementById('tasksContainer');
  if(!box) return;
  let list = actionTasks();
  if(taskFilter!=='all') list = list.filter(t=>t.status===taskFilter);
  list.sort((a,b)=>a.due-b.due);
  box.innerHTML = list.length? `<div class="card divide">
    ${list.map(t=>`
      <div class="task-row">
        <div class="task-check" data-advance="${t.orderId}" title="Mark this step complete"></div>
        <div style="min-width:0; cursor:pointer;" data-nav="#/orders/${t.orderId}">
          <div class="task-name">${t.name}</div>
          <div class="task-order">${t.orderId} · ${t.orderCustomer} · Due ${fmtDateShort(t.due)}</div>
        </div>
        <div class="task-meta">${ownerChip(t.owner)}${statusPill(t.status)}</div>
      </div>`).join('')}
  </div>` : `<div class="card"><div class="empty">${ORDERS.length? 'No tasks in this filter.' : 'No export orders yet — add one to see live tasks here.'}</div></div>`;
}

// ---------- SUPPLIERS ----------
function viewSuppliers(){
  const rows = ORDERS.map(o=>({o,d:getDerived(o)})).filter(x=>!x.d.isComplete && x.d.stage>=3 && x.d.stage<=5);
  return `
  <div class="section-head"><h2>Orders Needing Procurement Action</h2></div>
  ${rows.length? `<div class="table-wrap"><table>
    <thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Current Step</th><th>Owner</th><th>Due</th></tr></thead>
    <tbody>${rows.map(x=>`<tr data-nav="#/orders/${x.o.id}"><td class="cell-strong mono">${x.o.id}</td><td>${x.o.customer}</td><td>${x.o.product}</td><td>${x.d.activeStep.label}</td><td>${ownerChip(x.d.owner)}</td><td class="mono">${fmtDateShort(x.d.dueDate)}</td></tr>`).join('')}</tbody>
  </table></div>` : `<div class="card"><div class="empty">No orders are currently at the Procurement / Awaiting Supplies stage. This list populates automatically as orders reach those steps.</div></div>`}`;
}

// ---------- CUSTOMERS ----------
function ordersForCustomer(c){
  return ORDERS.filter(o=> o.customerId===c.id || (o.customer||'').toLowerCase()===c.name.toLowerCase());
}
function viewCustomers(){
  const rows = CUSTOMERS.map(c=>{
    const os = ordersForCustomer(c);
    return {id:c.id, name:c.name, country:c.country||'', emails:c.emails||[], orders:os.length, value:os.reduce((t,o)=>t+o.value,0),
            open:INQUIRIES.filter(q=>q.customerId===c.id && OPEN_STATUSES.includes(q.status)).length};
  });
  // customers that only exist as order names (e.g. the built-in example) keep showing, as before
  const known = new Set(rows.map(r=>r.name.toLowerCase()));
  const derived = {};
  ORDERS.forEach(o=>{
    if(known.has((o.customer||'').toLowerCase())) return;
    derived[o.customer] = derived[o.customer] || {id:null, name:o.customer, country:o.country||'', emails:[], orders:0, value:0, open:0};
    derived[o.customer].orders++; derived[o.customer].value += o.value;
  });
  const all = [...rows, ...Object.values(derived)].sort((a,b)=>b.value-a.value);
  if(!all.length) return `<div class="card"><div class="empty">No customers yet — they appear here as soon as you create an export order.</div></div>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Customer</th><th>Country</th><th>Email addresses</th><th>Total Orders</th><th>Total Value</th><th>Open inquiries</th></tr></thead>
    <tbody>${all.map(c=>`<tr ${c.id?`data-nav="#/customers/${c.id}"`:'style="cursor:default;"'}><td class="cell-strong">${esc(c.name)}</td><td>${esc(c.country)}</td><td style="font-size:12px; color:var(--text-2);">${c.emails.map(esc).join(', ')||'—'}</td><td class="mono">${c.orders}</td><td class="mono">${fmtMoney(c.value)}</td><td>${c.open?`<span class="pill pill-warn">${c.open}</span>`:'—'}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

function viewCustomerFolder(id){
  const c = CUSTOMERS.find(x=>x.id===id);
  if(!c) return `<div class="empty">${CUSTOMERS_LOADED?'Customer not found.':'Loading…'}</div>`;
  const os = ordersForCustomer(c);
  const mine = INQUIRIES.filter(q=>q.customerId===id);
  const open = mine.filter(q=>OPEN_STATUSES.includes(q.status));
  const past = mine.filter(q=>!OPEN_STATUSES.includes(q.status));
  return `
  <div class="detail-head">
    <div class="detail-top"><div>
      <div style="font-size:11px; color:var(--text-muted);">CUSTOMER FOLDER</div>
      <h2 style="font-size:21px; margin-top:4px;">${esc(c.name)}</h2>
      <div style="color:var(--text-muted); font-size:13px; margin-top:2px;">${esc(c.country||'')} ${c.emails&&c.emails.length?'· '+c.emails.map(esc).join(', '):''}</div>
    </div></div>
    <div class="detail-grid">
      <div><div class="dg-label">Orders</div><div class="dg-value">${os.length}</div></div>
      <div><div class="dg-label">Total value</div><div class="dg-value mono">${fmtMoney(os.reduce((t,o)=>t+o.value,0))}</div></div>
      <div><div class="dg-label">Open inquiries</div><div class="dg-value">${open.length}</div></div>
    </div>
  </div>
  <div class="section-head"><h2>Open inquiries</h2></div>
  ${open.length? `<div class="stack" style="gap:12px; margin-bottom:24px;">${open.map(q=>inquiryCard(q)).join('')}</div>` : `<div class="card" style="margin-bottom:24px;"><div class="empty">No open inquiries from this customer.</div></div>`}
  <div class="section-head"><h2>Orders</h2></div>
  ${os.length? `<div class="table-wrap" style="margin-bottom:24px;"><table>
    <thead><tr><th>Order</th><th>Product</th><th>Quantity</th><th>Value</th><th>Stage</th><th>Ship date</th></tr></thead>
    <tbody>${os.map(o=>{ const d=getDerived(o); return `<tr data-nav="#/orders/${o.id}"><td class="cell-strong mono">${o.id}</td><td>${esc(o.product)}</td><td>${esc(formatQty(o))}</td><td class="mono">${fmtMoney(o.value)}</td><td>${STAGES[d.stage]}</td><td class="mono">${fmtDateShort(o.shipDate)}</td></tr>`; }).join('')}</tbody>
  </table></div>` : `<div class="card" style="margin-bottom:24px;"><div class="empty">No orders yet.</div></div>`}
  ${past.length? `<div class="section-head"><h2>Earlier emails</h2></div><div class="stack" style="gap:12px;">${past.map(q=>inquiryCard(q,{compact:true})).join('')}</div>` : ''}`;
}

// ---------- DOCUMENTS ----------
function viewDocuments(){
  const rows = [];
  ORDERS.forEach(o=> getDerived(o).linkedDocs.forEach(l=> rows.push({...l, orderId:o.id, customer:o.customer})));
  const pill = l => l.locked ? '<span class="pill pill-neutral">Locked</span>'
    : l.uploaded ? `<span class="pill pill-good">${l.viaDocument?'Uploaded':'Logged manually'}</span>`
    : '<span class="pill pill-crit">Not Uploaded</span>';
  if(!rows.length) return `<div class="card"><div class="empty">No export orders yet — documents appear here once you create one.</div></div>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Document</th><th>Order</th><th>Customer</th><th>Status</th></tr></thead>
    <tbody>${rows.map(l=>`<tr data-nav="#/orders/${l.orderId}"><td class="cell-strong">${l.docType}</td><td class="mono">${l.orderId}</td><td>${l.customer}</td><td>${pill(l)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

// ---------- CALENDAR ----------
function viewCalendar(){
  const events = [];
  ORDERS.forEach(o=>{ const d=getDerived(o); if(!d.isComplete) events.push({date:o.shipDate, label:`Shipment — ${o.id} (${o.customer})`, orderId:o.id}); });
  actionTasks().forEach(t=> events.push({date:t.due, label:`${t.name} — ${t.orderId}`, orderId:t.orderId}));
  events.sort((a,b)=>a.date-b.date);
  const upcoming = events.filter(e=>daysBetween(TODAY,e.date)>=-3).slice(0,18);
  if(!upcoming.length) return `<div class="card"><div class="empty">No upcoming dates yet — create an export order to populate the calendar.</div></div>`;
  return `<div class="card divide">
    ${upcoming.map(e=>`
      <div class="calrow" style="cursor:pointer;" data-nav="#/orders/${e.orderId}">
        <div class="caldate"><div class="d">${e.date.getDate()}</div><div class="m">${e.date.toLocaleDateString('en-US',{month:'short'})}</div></div>
        <div style="font-size:12.8px; font-weight:500;">${e.label}</div>
        <div style="margin-left:auto; font-size:11.3px; color:${daysBetween(TODAY,e.date)<0?'var(--crit)':'var(--text-muted)'}">${daysBetween(TODAY,e.date)<0?Math.abs(daysBetween(TODAY,e.date))+'d overdue':daysBetween(TODAY,e.date)+'d away'}</div>
      </div>`).join('')}
  </div>`;
}

// ---------- ANALYTICS ----------
function viewAnalytics(){
  const rows = ORDERS.map(o=>({o,d:getDerived(o)}));
  const active = rows.filter(x=>!x.d.isComplete);
  const good = active.filter(x=>x.d.cat.key==='good').length;
  const warn = active.filter(x=>x.d.cat.key==='warn').length;
  const crit = active.filter(x=>x.d.cat.key==='crit').length;
  const total = active.length || 1;
  const metrics = [
    ['Enquiries Responded On Time', 96],
    ['Supplier Follow-Ups Completed', 88],
    ['Documentation On Time', 94],
    ['Shipments On Schedule', 91],
    ['Bank Submission Discipline', 97],
  ];
  const opsScore = Math.round(metrics.reduce((s,m)=>s+m[1],0)/metrics.length);

  return `
  <div class="two-col" style="margin-bottom:20px;">
    <div class="card" style="padding:22px 24px;">

function aiAnswer(q){
  const box = document.getElementById('aiAnswer');
  const lower = q.toLowerCase();
  let html = '';
  const orderMatch = q.match(/AA-2026-\d{3}/i);

  if(orderMatch){
    const o = ORDERS.find(x=>x.id.toLowerCase()===orderMatch[0].toLowerCase());
    if(o){
      const d = getDerived(o);
      const impacted = d.steps.filter(s=>s.i>d.activeIdx).map(s=>s.label);
      html = `<h3 style="font-size:15px; margin-bottom:12px;">${o.id} — ${d.cat.label}</h3>
      <p style="font-size:13.3px; color:var(--text-2); margin:0 0 14px;"><strong>${o.customer}</strong>, ${o.country} — Health ${d.health}/100</p>
      ${d.blocker? `<div class="reason-item"><span class="reason-num">1</span><span>${d.blocker}</span></div>
      <div class="reason-item"><span class="reason-num">2</span><span>${impacted.length} downstream step(s) cannot begin until this is resolved: ${impacted.slice(0,3).join(', ')}${impacted.length>3?'…':''}.</span></div>
      <div class="reason-item"><span class="reason-num">3</span><span>Shipment is scheduled in ${daysBetween(TODAY,o.shipDate)} day(s).</span></div>`
      : `<p style="font-size:13.3px;">No active blocker — order is progressing normally through ${STAGES[d.stage]}, currently at "${d.isComplete?'Closed':d.activeStep.label}".</p>`}
      <div class="subtle-card" style="margin-top:16px;"><strong style="font-size:12.5px;">Recommended Action</strong><p style="font-size:12.8px; margin:6px 0 0;">${d.next}</p></div>`;
    } else html = `<p>I couldn't find order ${orderMatch[0]}.</p>`;
  } else if(lower.includes('miss') || lower.includes('risk')){
    const risky = ORDERS.map(o=>({o,d:getDerived(o)})).filter(x=>!x.d.isComplete && x.d.cat.key!=='good').sort((a,b)=>daysBetween(TODAY,a.o.shipDate)-daysBetween(TODAY,b.o.shipDate)).slice(0,5);
    html = `<h3 style="font-size:15px; margin-bottom:12px;">Orders Most Likely to Miss Shipment</h3>` +
      (risky.length ? risky.map((x,i)=>`<div class="reason-item"><span class="reason-num">${i+1}</span><span><strong>${x.o.id}</strong> (${x.o.customer}) — ships in ${daysBetween(TODAY,x.o.shipDate)}d. ${x.d.blocker||'Behind on ' + STAGES[x.d.stage] + '.'}</span></div>`).join('') : `<p>No orders currently at risk of missing shipment.</p>`);
  } else if(lower.includes('bottleneck') || lower.includes('stage')){
    const counts={};
    ORDERS.forEach(o=>{ const d=getDerived(o); if(!d.isComplete) counts[d.activeStep.label]=(counts[d.activeStep.label]||0)+1; });
    const ranked = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    html = `<h3 style="font-size:15px; margin-bottom:12px;">Where Orders Are Currently Stalling</h3>` +
      (ranked.length? ranked.map(([n,c],i)=>`<div class="reason-item"><span class="reason-num">${i+1}</span><span><strong>${n}</strong> — ${c} order(s) currently sitting here.</span></div>`).join('') : `<p>No active orders yet.</p>`);
  } else if(lower.includes('priorit') || lower.includes('today')){
    const urgent = actionTasks().filter(t=>t.status==='overdue').sort((a,b)=>a.due-b.due).slice(0,6);
    const dueSoon = actionTasks().filter(t=>t.status!=='overdue').sort((a,b)=>a.due-b.due).slice(0,6-urgent.length);
    const list = [...urgent, ...dueSoon];
    html = `<h3 style="font-size:15px; margin-bottom:12px;">Today's Priorities</h3>` +
      (list.length? list.map((t,i)=>`<div class="reason-item"><span class="reason-num">${i+1}</span><span><strong>${t.name}</strong> — ${t.orderId}, ${t.orderCustomer} (${statusPill(t.status)})</span></div>`).join('') : `<p>No tasks yet — create an export order to get started.</p>`);
  } else {
    html = `<p style="font-size:13.5px;">I can help analyze order risk, workflow bottlenecks, and today's priorities. Try one of the sample questions on the left, or ask about a specific order like "Why is AA-2026-020 on track?"</p>`;
  }
  box.innerHTML = html;
}

const esc = (v)=> String(v==null?'':v).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let INQUIRIES = [];

let CUSTOMERS_LOADED = false;
let inquiryTab = 'new';
const ACTIVITY_CACHE = {};
const OPEN_STATUSES = ['NEW_CUSTOMER','EXISTING_CUSTOMER','NEEDS_REVIEW'];
// Fields below this confidence are flagged. The authoritative routing
// threshold lives on the server (src/lib/intake/constants.ts); this is only
// for the visual flag and is kept at the same default.
const LOW_CONFIDENCE = 0.7;
const INQUIRY_FIELDS = [
  ['customerName','Customer'],['product','Product'],['quantity','Quantity'],['containerType','Container size'],
  ['containerCount','Containers'],['incoterm','Incoterm'],['destinationPort','Destination port'],['deadline','Deadline'],

async function loadInquiries(){
  try{
    const res = await fetch('/api/inquiries');
    if(!res.ok) return false;
    const rows = await res.json();
    const sig = JSON.stringify(rows.map(r=>[r.id,r.status,r.orderId]));
    const changed = sig !== window.__inqSig;
    window.__inqSig = sig;
    INQUIRIES = rows;
    return changed;
  }catch(e){ return false; }
}
async function loadCustomers(){
  try{
    const res = await fetch('/api/customers');
    if(res.ok){ CUSTOMERS = await res.json(); CUSTOMERS_LOADED = true; }

}

function replyByText(q){
  const ms = new Date(q.replyByAt).getTime() - Date.now();
  const abs = Math.abs(ms);
  const h = Math.floor(abs/3600000), m = Math.floor((abs%3600000)/60000);
  const dur = h>=24 ? `${Math.floor(h/24)}d ${h%24}h` : `${h}h ${String(m).padStart(2,'0')}m`;
  const cls = ms<=0 ? 'pill-crit' : ms<6*3600000 ? 'pill-warn' : 'pill-good';
  return {cls, text: ms<=0 ? `Reply overdue by ${dur}` : `Reply within ${dur}`};
}

function inquiryStatusPill(q){
  const map = {
    NEW_CUSTOMER:['pill-warn','New customer'],
    EXISTING_CUSTOMER:['pill-good', 'Existing customer'],
    ORDER_UPDATE:['pill-neutral','Added to order '+(q.orderId||'')],
    NEEDS_REVIEW:['pill-crit','Needs review'],
    CONVERTED:['pill-neutral','Converted to order '+(q.orderId||'')],
    DISMISSED:['pill-neutral','Dismissed'],
  };
  const [cls,label] = map[q.status] || ['pill-neutral', q.status];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

function inquiryCard(q, opts){
  opts = opts || {};
  const f = (q.extracted && q.extracted.fields) || {};
  const open = OPEN_STATUSES.includes(q.status);
  const rb = replyByText(q);
  const fieldRows = INQUIRY_FIELDS.map(([k,label])=>{
    const x = f[k];
    if(!x || x.value==null || x.value==='') return `<div><div class="dg-label">${label}</div><div class="dg-value" style="color:var(--text-muted); font-weight:500;">—</div></div>`;
    const low = typeof x.confidence==='number' && x.confidence < LOW_CONFIDENCE;
    return `<div title="${esc(x.snippet?'From the email: “'+x.snippet+'”':'')}" style="${low?'background:var(--warn-soft); border-radius:8px; padding:6px 8px; margin:-6px -8px;':''}">
      <div class="dg-label">${label}${low?' <span style="color:var(--warn-text);">⚠ low confidence</span>':''}</div>
      <div class="dg-value">${esc(x.value)}${k==='product' && q.extracted && q.extracted.productInferred ? ' <span class="pill pill-neutral" style="font-size:10px; padding:1px 6px;">inferred from last order</span>':''}</div>
    </div>`;
  }).join('');
  const conf = typeof q.overallConfidence==='number' ? `<span class="pill ${q.overallConfidence<LOW_CONFIDENCE?'pill-warn':'pill-neutral'}" title="Overall confidence">${Math.round(q.overallConfidence*100)}% confident</span>` : '';
  return `<div class="card" style="padding:16px 18px;">
    <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start;">
      <div style="min-width:0;">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">${inquiryStatusPill(q)}${q.customerId && q.customerName ? `<a href="#/customers/${esc(q.customerId)}" style="font-size:12.5px; font-weight:600; color:var(--accent);">${esc(q.customerName)}</a>`:''}${conf}</div>
        <div style="font-size:14px; font-weight:600; margin-top:6px;">${esc(q.subject||'(no subject)')}</div>
        <div style="font-size:12px; color:var(--text-muted);">${esc(q.fromName?q.fromName+' · ':'')}${esc(q.fromEmail)} · received ${new Date(q.receivedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      ${open ? `<span class="pill ${rb.cls}" data-replyby="${esc(q.replyByAt)}">${rb.text}</span>` : ''}
    </div>
    ${opts.compact ? '' : `<div class="detail-grid" style="margin-top:14px; padding-top:14px;">${fieldRows}</div>`}
    ${q.routeReason ? `<div style="font-size:11.5px; color:var(--text-muted); margin-top:10px;">Why it's here: ${esc(q.routeReason)}</div>` : ''}
    <details style="margin-top:10px;"><summary style="cursor:pointer; font-size:12px; font-weight:600; color:var(--text-2);">Original email</summary>
      <pre style="white-space:pre-wrap; font-family:inherit; font-size:12.5px; background:var(--surface-2); border-radius:8px; padding:10px 12px; margin:8px 0 0;">${esc(q.bodyText||'')}</pre></details>
    ${open ? `<div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn btn-primary" data-convert-inquiry="${esc(q.id)}">Convert to order</button>
      <button class="btn" data-dismiss-inquiry="${esc(q.id)}">Dismiss</button>
    </div>` : ''}
  </div>`;
}

function viewInquiries(){
  const tabs = [
    ['new','New customers', q=>q.status==='NEW_CUSTOMER'],
    ['existing','Existing customers', q=>q.status==='EXISTING_CUSTOMER'],
    ['review','Needs review', q=>q.status==='NEEDS_REVIEW'],
    ['updates','Order updates', q=>q.status==='ORDER_UPDATE'],
    ['closed','Closed', q=>q.status==='CONVERTED'||q.status==='DISMISSED'],
  ];
  const cur = tabs.find(t=>t[0]===inquiryTab) || tabs[0];
  const list = INQUIRIES.filter(cur[2]);
  const empty = {new:'No new-customer enquiries waiting. When someone we don\'t know emails the inbox, it lands here.', existing:'No open enquiries from existing customers. They also appear in each customer\'s folder.', review:'Nothing needs review. Uncertain or non-buyer emails land here.', updates:'No emails have been added to existing orders yet.', closed:'Nothing closed yet.'}[cur[0]];
  return `
  <div style="margin-bottom:14px; font-size:12.8px; color:var(--text-muted);">Emails to the intake inbox are read by AI and sorted by simple rules. <strong>Nothing becomes an order until you click “Convert to order”.</strong></div>

function prefillFromInquiry(q){
  const f = (q.extracted && q.extracted.fields) || {};
  const v = k => (f[k] && f[k].value!=null) ? f[k].value : '';
  const deadline = String(v('deadline'));
  return {
    inquiryId:q.id,
    customer: q.customerName || v('customerName') || q.fromName || '',
    country: q.customerCountry || '',
    product: v('product'),
    containerType: v('containerType'),
    containerCount: v('containerCount'),
    ship: /^\d{4}-\d{2}-\d{2}$/.test(deadline) ? deadline : '',
    inquiryDate: new Date(q.receivedAt).toISOString().slice(0,10),
  };
}

async function dismissInquiry(id){

// ---------- ONE-TIME IMPORT FROM LOCAL STORAGE ----------
// The only remaining use of localStorage: reading what older versions of the
// app saved in this browser, so it can be copied into the shared database.
function readLocalForImport(){
  const get = (k, d)=>{ try{ return JSON.parse(localStorage.getItem(k)||JSON.stringify(d)); }catch(e){ return d; } };
  const orders = get('afroflow_new_orders', []);
  const progress = get('afroflow_progress', {});
  const documents = get('afroflow_documents', {});
  const vessels = get('afroflow_vessels', {});
  // The built-in sample order may carry saved progress/vessel/documents too.
  const seed = RAW_ORDERS.filter(r=> progress[r.id]!=null || documents[r.id] || Object.prototype.hasOwnProperty.call(vessels, r.id)).map(r=>({...r, keepId:true}));
  return {orders, seed, progress, documents, vessels};
}
async function importLocalData(){
  const local = readLocalForImport();
  const all = [...local.orders, ...local.seed];
  if(!all.length){ showToast('Nothing to import from this browser.'); return; }
  showToast('Importing…');
  try{
    const res = await fetch('/api/import-local', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({orders:all, progress:local.progress, documents:local.documents, vessels:local.vessels})});
    const out = await res.json();
    if(!res.ok) throw new Error(out.error || res.status);
    await loadState();
    showToast(`Imported ${out.imported} order${out.imported===1?'':'s'}${out.skipped?` (${out.skipped} already there)`:''}.`);
    route();
  }catch(e){ showToast('Import failed: '+(e.message||e)); }
}

        <div id="formError" class="field-hint" style="display:none; color:var(--crit-text); background:var(--crit-soft); border-radius:8px; padding:9px 11px; margin-top:-2px;"></div>
        <p class="field-hint">The 15-step workflow, task schedule, owners and health score are generated automatically from these inputs and the shipment date — "Enquiry Received" is marked complete right away.</p>
      </div>
      <div class="modal-foot">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalCreate">Create Order</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalBack').onclick = (e)=>{ if(e.target.id==='modalBack') closeModal(); };
  document.getElementById('modalCreate').onclick = createOrderFromForm;
  document.getElementById('f_inquiry').value = TODAY.toISOString().slice(0,10);
  if(prefill){
    const set = (id,v)=>{ if(v!=='' && v!=null) document.getElementById(id).value = v; };
    set('f_customer', prefill.customer); set('f_country', prefill.country); set('f_product', prefill.product);
    if(prefill.containerType==='20ft' || prefill.containerType==='40ft') set('f_containerType', prefill.containerType);
    set('f_containerCount', prefill.containerCount); set('f_ship', prefill.ship); set('f_inquiry', prefill.inquiryDate);
  }
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; window.__prefillInquiryId = null; }
function showFormError(msg){
  const el = document.getElementById('formError');
  el.textContent = msg;
  el.style.display = 'block';
}
async function createOrderFromForm(){
  const customer = document.getElementById('f_customer').value.trim() || 'New Customer Ltd';
  const country = document.getElementById('f_country').value.trim() || 'Kenya';
  const product = document.getElementById('f_product').value.trim() || 'Export Product';
  const containerType = document.getElementById('f_containerType').value;
  const containerCount = Math.max(1, parseInt(document.getElementById('f_containerCount').value, 10) || 1);
  const value = Number(document.getElementById('f_value').value) || 25000;
  const terms = document.getElementById('f_terms').value;
  const inquiryRaw = document.getElementById('f_inquiry').value || TODAY.toISOString().slice(0,10);
  const shipRaw = document.getElementById('f_ship').value;
  const ship = shipRaw || addDays(TODAY,45).toISOString().slice(0,10);

  const inquiryDate = new Date(inquiryRaw);
  const shipDate = new Date(ship);
  if(inquiryDate > TODAY) return showFormError('Inquiry Received Date cannot be in the future.');
  if(shipDate < inquiryDate) return showFormError('Expected Shipment Date cannot be earlier than the Inquiry Received Date.');

  // createdAt is the true, automatic record-creation timestamp; inquiryDate
  // is the editable business date entered above. The server assigns the id.
  const payload = {customer, country, product, containerType, containerCount, value, terms, ship, inquiryDate:inquiryRaw, createdAt:new Date().toISOString(), sourceInquiryId: window.__prefillInquiryId || undefined};
  const btn = document.getElementById('modalCreate');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  let row;
  try{
    const res = await fetch('/api/orders', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    row = await res.json();
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Create Order'; }
    return showFormError('Could not save the order — check your connection and try again.');
  }
  ORDERS.unshift(applyOrderRow(buildOrder(row), row));
  closeModal();
  if(payload.sourceInquiryId){ await loadInquiries(); await loadCustomers(); }
  location.hash = '#/orders/' + row.id;
}

// ---------- EVENTS ----------
function afterRender(page, id){
  if(page==='orders' && !id) renderOrdersContainer();
  if(page==='tasks') renderTasksContainer();
  // Fetch scan status once per order visit — refreshScanCache() re-renders
  // itself when the data arrives, and subsequent actions (upload/scan/review)
  // call it explicitly, so this only needs to fire on first entry.
  if(page==='orders' && id && activeTab==='activity' && !ACTIVITY_CACHE[id]){
    ACTIVITY_CACHE[id] = [];
    fetch('/api/orders/'+encodeURIComponent(id)+'/activity').then(r=>r.ok?r.json():[]).then(rows=>{ ACTIVITY_CACHE[id]=rows; route(); }).catch(()=>{});
  }
  if(SCANNER_ENABLED && page==='orders' && id && activeTab==='documents' && !SCAN_CACHE[id]) refreshScanCache(id);

  document.getElementById('ordersSearch')?.addEventListener('input', e=>{ ordersFilters.q = e.target.value; renderOrdersContainer(); });
  document.getElementById('stageFilter')?.addEventListener('change', e=>{ ordersFilters.stage = e.target.value; renderOrdersContainer(); });
  document.getElementById('healthFilter')?.addEventListener('change', e=>{ ordersFilters.health = e.target.value; renderOrdersContainer(); });
  document.querySelectorAll('[data-view]').forEach(btn=> btn.addEventListener('click', ()=>{ ordersViewMode = btn.dataset.view; route(); }));

  document.querySelectorAll('[data-task-filter]').forEach(btn=> btn.addEventListener('click', ()=>{ taskFilter = btn.dataset.taskFilter; route(); }));

  document.querySelectorAll('[data-tab]').forEach(btn=> btn.addEventListener('click', ()=>{
    activeTab = btn.dataset.tab;
    const o = ORDERS.find(x=>x.id===id);
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===activeTab));
    document.getElementById('tabContent').innerHTML = renderOrderTab(o, activeTab);
    afterRender('orders', id);
  }));

  document.getElementById('aiAsk')?.addEventListener('click', ()=>{
    const v = document.getElementById('aiInput').value.trim();
    if(v) aiAnswer(v);
  });
  document.getElementById('aiInput')?.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const v=e.target.value.trim(); if(v) aiAnswer(v); } });
  document.querySelectorAll('[data-ai-q]').forEach(btn=> btn.addEventListener('click', ()=> aiAnswer(btn.dataset.aiQ)));
}

document.addEventListener('click', (e)=>{
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ location.hash = navEl.dataset.nav; return; }

  const advEl = e.target.closest('[data-advance]');
  if(advEl){
    e.stopPropagation();
    const o = ORDERS.find(x=>x.id===advEl.dataset.advance);
    if(o){
      const d = getDerived(o);
      if(!d.isComplete){ o.doneCount++; saveProgress(o.id, o.doneCount, o.docSteps); }
      route();
    }
    return;
  }

  const stepEl = e.target.closest('[data-step-toggle]');
  if(stepEl){
    e.stopPropagation();
    const [orderId, idxStr] = stepEl.dataset.stepToggle.split(':');
    const idx = Number(idxStr);
    const o = ORDERS.find(x=>x.id===orderId);
    if(o){
      if(idx===o.doneCount && o.doneCount<STEPS.length) o.doneCount++;
      else if(idx===o.doneCount-1 && idx>=1){
        o.doneCount--;
        o.docSteps = o.docSteps.filter(i=>i!==idx);
      }
      saveProgress(orderId, o.doneCount, o.docSteps);
      route();
    }
    return;
  }

  const uploadDocEl = e.target.closest('[data-upload-doc]');
  if(uploadDocEl){
    e.stopPropagation();
    const [orderId, docType] = uploadDocEl.dataset.uploadDoc.split(':');
    const input = document.getElementById(`fileInput_${orderId}_${docType.replace(/\s+/g,'')}`);
    if(SCANNABLE_DOC_TYPES.includes(docType)){
      const file = input?.files?.[0];
      if(!file){ showToast('Choose a file first.'); return; }
      uploadScannableDocument(orderId, docType, file);
    } else {
      const fileName = input?.files?.[0]?.name || `${docType}.pdf`;
      uploadLinkedDocument(orderId, docType, fileName);
    }
    return;
  }

  const deleteDocEl = e.target.closest('[data-delete-doc]');
  if(deleteDocEl){
    e.stopPropagation();
    const [orderId, docType] = deleteDocEl.dataset.deleteDoc.split(':');
    deleteLinkedDocument(orderId, docType);
    return;
  }

  const scanDocEl = e.target.closest('[data-scan-doc]');
  if(scanDocEl){
    e.stopPropagation();
    const [orderId, docType] = scanDocEl.dataset.scanDoc.split(':');
    runScan(orderId, docType);
    return;
  }

  const scanAllEl = e.target.closest('[data-scan-all]');
  if(scanAllEl){
    e.stopPropagation();
    scanAllForOrder(scanAllEl.dataset.scanAll);
    return;
  }

  const reviewDiscEl = e.target.closest('[data-review-disc]');
  if(reviewDiscEl){
    e.stopPropagation();
    const [discId, status, orderId, docType] = reviewDiscEl.dataset.reviewDisc.split(':');
    reviewDiscrepancy(discId, status, orderId, docType);
    return;
  }

  const convEl = e.target.closest('[data-convert-inquiry]');
  if(convEl){ e.stopPropagation(); const q = INQUIRIES.find(x=>x.id===convEl.dataset.convertInquiry); if(q) openNewOrderModal(prefillFromInquiry(q)); return; }
  const dismEl = e.target.closest('[data-dismiss-inquiry]');
  if(dismEl){ e.stopPropagation(); dismissInquiry(dismEl.dataset.dismissInquiry); return; }
  const inqTabEl = e.target.closest('[data-inq-tab]');
  if(inqTabEl){ e.stopPropagation(); inquiryTab = inqTabEl.dataset.inqTab; route(); return; }

  if(e.target.closest('[data-import-local]')){ e.stopPropagation(); importLocalData(); return; }

  const saveVesselEl = e.target.closest('[data-save-vessel]');
  if(saveVesselEl){
    e.stopPropagation();
    const orderId = saveVesselEl.dataset.saveVessel;
    const name = document.getElementById('vesselNameInput')?.value.trim();
    const imo = document.getElementById('vesselImoInput')?.value.trim();
    if(name && imo){ saveVessel(orderId, {name, imo}); route(); }
    return;
  }
  const editVesselEl = e.target.closest('[data-edit-vessel]');
  if(editVesselEl){
    e.stopPropagation();
    saveVessel(editVesselEl.dataset.editVessel, null);
    route();
  }
});
document.getElementById('newOrderBtn').addEventListener('click', openNewOrderModal);
document.getElementById('globalSearch').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.value.trim()){
    ordersFilters.q = e.target.value.trim();
    location.hash = '#/orders';
  }
});
document.getElementById('menuBtn').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
if(window.matchMedia('(max-width:760px)').matches) document.getElementById('menuBtn').style.display='flex';

window.addEventListener('hashchange', route);
(async function bootstrap(){
  let failed = null;
  try{ await loadState(); }catch(e){ failed = String(e && e.message || e); RAW_ORDERS.forEach(r=>{ ORDER_META[r.id] = ORDER_META[r.id] || {}; }); }
  await Promise.all([loadInquiries(), loadCustomers()]);
  route();
  if(failed) showBackendError('('+failed+')');
})();
